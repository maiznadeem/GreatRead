# Deployed by Workers Builds on every push to main that touches edge/api/* (root edge/api, no build step,
# `npx wrangler deploy`). Manual fallback: from edge/api, with CLOUDFLARE_API_TOKEN set: npx wrangler@4 deploy
# The secret is set once with: npx wrangler@4 secret put ORIGIN_AUTH (same value as ORIGIN_AUTH in greatread-secrets)
name = "greatread-api-edge"
main = "index.js"
compatibility_date = "2026-11-01"
account_id = "803b01a6e3e53ef41f175e2a54e51372"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.greatread.himaiz.com", custom_domain = true }]

[vars]
ORIGIN = "https://great-read-maiz-portfolio-913220110827.us-central1.run.app"

[observability]
enabled = true
# Cloudflare attaches the request URL to every log event; strip its query, which can carry tokens and search terms.
redact_query_string = true

# Only the Worker's own JSON line (LOGGING.md). Cloudflare's per-request invocation log repeats it and records the
# full URL, query included.
[observability.logs]
invocation_logs = false
